<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>JoyRx</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#05050a" />
    <script>
      // 谷歌登录回跳时 URL 带 access_token，先打个标记（Supabase 随后会把 hash 清掉，
      // 应用里检测到标记就整页重载一次，否则手机 Chrome 会锁在电脑版宽度）
      try {
        if (window.location.hash.indexOf("access_token=") !== -1) {
          sessionStorage.setItem("oauth_return", "1");
        }
      } catch (e) {}
    </script>
    <meta name="description" content="尊享节点 · 独享账号 · 极速体验">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dustan.lovable.app/" />

    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"JoyRx","url":"https://dustan.lovable.app/","inLanguage":"zh-CN"}
    </script>
    <meta property="og:image" content="https://dustan.lovable.app/joyrx-icon.png">
    <meta name="twitter:image" content="https://dustan.lovable.app/joyrx-icon.png">
    <meta property="og:title" content="JoyRx">
    <meta name="twitter:title" content="JoyRx">
    <meta property="og:description" content="尊享节点 · 独享账号 · 极速体验">
    <meta name="twitter:description" content="尊享节点 · 独享账号 · 极速体验">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.warn("Service worker registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
